# ============================================================
# Application
# ============================================================
spring.application.name=farmer-assistant
server.port=${PORT:8080}

# ============================================================
# MySQL Database Configuration
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmer_assistant_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:JDBC}
spring.datasource.password=${DB_PASSWORD:@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JWT Configuration
# ============================================================
app.jwt.secret=${JWT_SECRET:farmer-assistant-secret-key}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
# OpenAI Configuration
# ============================================================
openai.api.key=${OPENAI_API_KEY}
openai.api.base-url=https://api.openai.com/v1
openai.model.chat=gpt-4o-mini
openai.model.vision=gpt-4o-mini
openai.max-tokens=300

# ============================================================
# File Upload Configuration
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Allowed image types
app.upload.allowed-types=image/jpeg,image/png,image/jpg,image/webp

# ============================================================
# Rate Limiting Configuration
# ============================================================
app.rate-limit.chat.capacity=10
app.rate-limit.chat.refill-tokens=10
app.rate-limit.chat.refill-seconds=60

app.rate-limit.disease.capacity=5
app.rate-limit.disease.refill-tokens=5
app.rate-limit.disease.refill-seconds=60

# ============================================================
# Logging Configuration
# ============================================================
logging.level.com.farmerassistant=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
